name: Bootstrap reviewed three-family source tree
on:
  push:
    branches:
      - feature/three-family-pilot-20260920
permissions:
  contents: write
jobs:
  apply-reviewed-tree:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/three-family-pilot-20260920
          fetch-depth: 0
      - name: Apply exact reviewed source tree
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '' | base64 -d | gzip -d > "$RUNNER_TEMP/three-family.patch"
          git apply --binary "$RUNNER_TEMP/three-family.patch"
          rm -f .github/workflows/bootstrap-three-family.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Prepare guarded three-family T4 pilot"
          git push origin HEAD:feature/three-family-pilot-20260920
