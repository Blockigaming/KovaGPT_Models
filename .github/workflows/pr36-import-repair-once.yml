name: PR 36 source-only import repair
on:
  push:
    branches: [verify/cosmo-dataset-review-ledger-20260919]
    paths: [.github/workflows/pr36-import-repair-once.yml]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Preserve concurrent source changes
        run: git diff --exit-code 0169296497190fb9418976666e699916cfcc7be4 HEAD -- training/kova_cosmo_sft.py training/test_kova_cosmo_sft.py
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install only hash-locked source verification dependencies
        env:
          PIP_CONFIG_FILE: /dev/null
          PIP_EXTRA_INDEX_URL: ''
        run: |
          python -m pip install --index-url https://pypi.org/simple --disable-pip-version-check --require-hashes --only-binary=:all: -r requirements/receiver-auth-py312-linux.lock -r requirements/postgres-store-py312.lock
          python -m pip check
      - name: Apply the tested lazy-import fix and regression
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('training/kova_cosmo_sft.py')
          s = p.read_text()
          old = '''from training.cosmo_generation_attestation import (
              AttestationError,
              load_signing_key,
              load_trust_policy as load_generation_trust_policy,
          )
          '''
          assert s.count(old) == 1
          s = s.replace(old, '')
          marker = 'def execute() -> dict:\n'
          assert s.count(marker) == 1
          s = s.replace(marker, '''def load_generation_trust_policy(root: Path) -> dict:
              """Keep cryptography off the source-only and CPU recipe import path."""
              from training.cosmo_generation_attestation import load_trust_policy

              return load_trust_policy(root)


          def load_signing_key(path: Path, **arguments):
              """Import the authenticated key loader only for authorized execution."""
              from training.cosmo_generation_attestation import load_signing_key as loader

              return loader(path, **arguments)


          ''' + marker)
          assert s.count('except (AttestationError, KeyError):') == 1
          s = s.replace('except (AttestationError, KeyError):', 'except (ImportError, OSError, ValueError, KeyError):')
          p.write_text(s)
          p = Path('training/test_kova_cosmo_sft.py')
          s = p.read_text()
          marker = 'class KovaCosmoSftTests(unittest.TestCase):\n'
          assert s.count(marker) == 1
          s = s.replace(marker, marker + '''    def test_recipe_imports_without_site_packages_or_signing_dependencies(self):
                  result = recipe.subprocess.run(
                      [recipe.sys.executable, "-E", "-S", "-B", "-c",
                       "import sys; from training.kova_cosmo_sft import load_recipe; "
                       "assert load_recipe()['execution']['deployment_authorized'] is False; "
                       "assert not any(name == 'cryptography' or name.startswith('cryptography.') "
                       "for name in sys.modules); "
                       "assert 'torch' not in sys.modules"],
                      cwd=recipe.ROOT, capture_output=True, text=True,
                      check=False, timeout=30,
                  )
                  self.assertEqual(result.returncode, 0, result.stderr)

          ''')
          p.write_text(s)
          PY
          git diff --check
      - name: Run all affected source-only tests on Python 3.12
        env:
          HF_HUB_OFFLINE: '1'
          TRANSFORMERS_OFFLINE: '1'
          HF_DATASETS_OFFLINE: '1'
          CUDA_VISIBLE_DEVICES: ''
        run: python -m unittest training.test_kova_cosmo_sft training.test_cosmo_adapter_receipt training.test_cosmo_runtime_guard training.test_cosmo_sft_evaluation
      - name: Create a verified candidate without moving any branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, pathlib, subprocess, urllib.request
          paths = ['training/kova_cosmo_sft.py', 'training/test_kova_cosmo_sft.py']
          changed = subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines()
          assert set(changed) == set(paths)
          head = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          base_tree = subprocess.check_output(['git', 'rev-parse', 'HEAD^{tree}'], text=True).strip()
          def post(endpoint, payload):
              request = urllib.request.Request(
                  'https://api.github.com/repos/Blockigaming/KovaGPT_Models/' + endpoint,
                  data=json.dumps(payload).encode(), method='POST', headers={
                      'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                      'Accept': 'application/vnd.github+json',
                      'X-GitHub-Api-Version': '2022-11-28',
                      'Content-Type': 'application/json',
                  })
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)
          entries = [{'path': p, 'mode': '100644', 'type': 'blob', 'content': pathlib.Path(p).read_text()} for p in paths]
          entries.append({'path': '.github/workflows/pr36-import-repair-once.yml', 'mode': '100644', 'type': 'blob', 'sha': None})
          tree = post('git/trees', {'base_tree': base_tree, 'tree': entries})
          commit = post('git/commits', {'message': 'fix(training): isolate authenticated signing imports from CPU validation', 'tree': tree['sha'], 'parents': [head]})
          print('REPAIR_CANDIDATE_SHA=' + commit['sha'])
          print('Temporary workflow removed from candidate; no branch moved.')
          PY
