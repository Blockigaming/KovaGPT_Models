name: PR 36 projection regression repair
on:
  push:
    branches: [verify/cosmo-dataset-review-ledger-20260919]
    paths: [.github/workflows/pr36-projection-repair-once.yml]
permissions:
  contents: write
jobs:
  verify-repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Guard the inspected source files
        run: git diff --exit-code d20a9f5edd4a71bf9baffdab49a13971dc89f52d HEAD -- training/cosmo_adapter_receipt.py training/test_cosmo_adapter_receipt.py
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install only hash-locked source verification dependencies
        env:
          PIP_CONFIG_FILE: /dev/null
          PIP_EXTRA_INDEX_URL: ''
        run: |
          python -m pip install --index-url https://pypi.org/simple --disable-pip-version-check --require-hashes --only-binary=:all: -r requirements/receiver-auth-py312-linux.lock -r requirements/postgres-store-py312.lock
          python -m pip check
      - name: Add independent full-layout regression and prove red then green
        env:
          HF_HUB_OFFLINE: '1'
          TRANSFORMERS_OFFLINE: '1'
          HF_DATASETS_OFFLINE: '1'
          CUDA_VISIBLE_DEVICES: ''
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess, sys
          p = Path('training/test_cosmo_adapter_receipt.py')
          s = p.read_text()
          before = '    def write_safetensors(self, path: Path, *, omit_last: bool = False) -> None:\n'
          after = ('    def write_safetensors(self, path: Path, *, omit_last: bool = False,\n'
                   '                          output_projection_input_width: int = 16 * 128) -> None:\n')
          assert s.count(before) == 1
          s = s.replace(before, after)
          before = '"v_proj": hidden, "o_proj": hidden,'
          assert s.count(before) == 1
          s = s.replace(before, '"v_proj": hidden, "o_proj": output_projection_input_width,')
          marker = '    def test_receipt_binds_source_lineage_recipe_lock_and_adapter(self):\n'
          assert s.count(marker) == 1
          test = '''    def test_output_projection_requires_all_attention_heads(self):
                  recipe = {"lora": {"r": 16, "target_modules": EXPECTED_TARGETS}}
                  with tempfile.TemporaryDirectory() as directory:
                      weights = Path(directory) / "synthetic.safetensors"
                      self.write_safetensors(weights)
                      raw = weights.read_bytes()
                      header_size = struct.unpack("<Q", raw[:8])[0]
                      header = json.loads(raw[8:8 + header_size])
                      name = "base_model.model.model.layers.0.self_attn.o_proj.lora_A.weight"
                      self.assertEqual(header[name]["shape"], [16, 16 * 128])
                      receipt.validate_safetensors(weights, recipe)
                      # Rebuild every byte offset and the payload for the old width.
                      # Rejection must be dimensional, not caused by a corrupt layout.
                      self.write_safetensors(weights, output_projection_input_width=1024)
                      with self.assertRaises(receipt.ReceiptError):
                          receipt.validate_safetensors(weights, recipe)

          '''
          p.write_text(s.replace(marker, test + marker))
          test_name = 'training.test_cosmo_adapter_receipt.CosmoAdapterReceiptTests.test_output_projection_requires_all_attention_heads'
          red = subprocess.run([sys.executable, '-m', 'unittest', test_name], capture_output=True, text=True, timeout=60)
          print(red.stdout + red.stderr)
          assert red.returncode != 0 and 'ReceiptError' in red.stderr and 'Ran 1 test' in red.stderr, 'regression did not expose old implementation'
          p = Path('training/cosmo_adapter_receipt.py')
          s = p.read_text()
          before = '"v_proj": hidden, "o_proj": hidden,'
          assert s.count(before) == 1
          p.write_text(s.replace(before, '"v_proj": hidden, "o_proj": expected_query_size,'))
          subprocess.run([sys.executable, '-m', 'unittest',
                          'training.test_cosmo_adapter_receipt',
                          'training.test_cosmo_runtime_guard',
                          'training.test_cosmo_sft_evaluation',
                          'training.test_kova_cosmo_sft'], check=True, timeout=180)
          PY
          git diff --check
      - name: Create verified candidate without moving any branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, pathlib, subprocess, urllib.request
          paths = ['training/cosmo_adapter_receipt.py', 'training/test_cosmo_adapter_receipt.py']
          changed = subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines()
          assert set(changed) == set(paths)
          head = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          base_tree = subprocess.check_output(['git', 'rev-parse', 'HEAD^{tree}'], text=True).strip()
          def post(endpoint, payload):
              request = urllib.request.Request('https://api.github.com/repos/Blockigaming/KovaGPT_Models/' + endpoint,
                  data=json.dumps(payload).encode(), method='POST', headers={
                      'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                      'Accept': 'application/vnd.github+json',
                      'X-GitHub-Api-Version': '2022-11-28', 'Content-Type': 'application/json'})
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)
          entries = [{'path': p, 'mode': '100644', 'type': 'blob', 'content': pathlib.Path(p).read_text()} for p in paths]
          entries.append({'path': '.github/workflows/pr36-projection-repair-once.yml', 'mode': '100644', 'type': 'blob', 'sha': None})
          tree = post('git/trees', {'base_tree': base_tree, 'tree': entries})
          commit = post('git/commits', {'message': 'fix(training): validate full attention width for output projection', 'tree': tree['sha'], 'parents': [head]})
          print('REPAIR_CANDIDATE_SHA=' + commit['sha'])
          print('No branch moved; temporary workflow removed from candidate.')
          PY
