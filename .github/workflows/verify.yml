name: Verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  three-family-model-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        family: [kova-cosmo, kova-orion, kova-nova]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate immutable family contract without provider calls
        env:
          KOVA_CONTRACT_FAMILY: ${{ matrix.family }}
          HF_HUB_OFFLINE: '1'
          TRANSFORMERS_OFFLINE: '1'
        run: |
          python -m training.three_family_contract > contract.json
          python -c 'import json,os; r=json.load(open("contract.json")); assert os.environ["KOVA_CONTRACT_FAMILY"] in r["families"]; assert r["provider_calls_made"] == 0; assert r["weights_downloaded"] is False'

  cosmo-peft-cpu-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements/cosmo-loss-mask-py312-linux-cpu.lock
      - name: Install hash-locked CPU-only SFT dependencies
        env:
          PIP_CONFIG_FILE: /dev/null
          PIP_EXTRA_INDEX_URL: ""
        run: |
          python -m pip install --disable-pip-version-check \
            --require-hashes -r requirements/cosmo-loss-mask-py312-linux-cpu.lock
          python -m pip check
      - name: Verify synthetic Qwen3 LoRA forward, backward and adapter reload
        env:
          HF_HUB_OFFLINE: '1'
          TRANSFORMERS_OFFLINE: '1'
          HF_DATASETS_OFFLINE: '1'
          WANDB_DISABLED: 'true'
          CUDA_VISIBLE_DEVICES: ""
        run: python -m training.validate_kova_cosmo_peft_cpu

  cosmo-sft-api-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements/kova-cosmo-sft-py312-linux.lock
      - name: Install hash-locked SFT API dependencies
        env:
          PIP_CONFIG_FILE: /dev/null
          PIP_EXTRA_INDEX_URL: ""
        run: |
          python -m pip install --disable-pip-version-check \
            --require-hashes -r requirements/kova-cosmo-sft-py312-linux.lock
          python -m pip check
      - name: Validate pinned APIs without models or training
        env:
          HF_HUB_OFFLINE: '1'
          TRANSFORMERS_OFFLINE: '1'
          WANDB_DISABLED: 'true'
        run: python -m training.validate_kova_cosmo_sft_api

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install hash-pinned CPU verification dependencies in isolation
        env:
          PIP_CONFIG_FILE: /dev/null
          PIP_EXTRA_INDEX_URL: ""
        run: |
          set -eu
          test "$(uname -m)" = x86_64
          python3.12 -m venv "$RUNNER_TEMP/kova-receiver-auth"
          "$RUNNER_TEMP/kova-receiver-auth/bin/python" -m pip install \
            --index-url https://pypi.org/simple --disable-pip-version-check \
            --require-hashes --only-binary=:all: \
            -r requirements/receiver-auth-py312-linux.lock \
            -r requirements/postgres-store-py312.lock
          "$RUNNER_TEMP/kova-receiver-auth/bin/python" -m pip check
          echo "$RUNNER_TEMP/kova-receiver-auth/bin" >> "$GITHUB_PATH"
      - name: Fetch verified Microsoft compiler for offline template checks only
        run: |
          set -eu
          compiler="$RUNNER_TEMP/kova-bicep"
          curl --fail --location --silent --show-error --max-time 60 \
            https://github.com/Azure/bicep/releases/download/v0.47.16/bicep-linux-x64 \
            --output "$compiler"
          echo "64c345a58e0c3e48b1bc98a4e62d6b3adb1d238281297de3400aeafb2697aa5a  $compiler" | sha256sum -c -
          chmod 700 "$compiler"
          "$compiler" --version
          echo "KOVA_BICEP=$compiler" >> "$GITHUB_ENV"
      - run: npm test
      - run: npm run preflight
      - name: Archive verified committed source
        if: github.event_name == 'push'
        run: |
          git archive --format=tar --output="$RUNNER_TEMP/model-source.tar" HEAD
          git rev-parse HEAD > "$RUNNER_TEMP/SOURCE_COMMIT.txt"
          cd "$RUNNER_TEMP"
          sha256sum model-source.tar > model-source.sha256
      - name: Retain exact-head source for offline verification
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: model-source-${{ github.sha }}
          path: |
            ${{ runner.temp }}/model-source.tar
            ${{ runner.temp }}/SOURCE_COMMIT.txt
            ${{ runner.temp }}/model-source.sha256
          if-no-files-found: error
          retention-days: 1
